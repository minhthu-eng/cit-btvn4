<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎄 Biểu mẫu Đăng ký Ứng tuyển 🎄</title>

  <!-- Favicon cây thông Noel -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='27' y='50' width='10' height='10' rx='2' fill='%237c2d12'/%3E%3Cpolygon points='32,6 14,28 50,28' fill='%2315803d'/%3E%3Cpolygon points='32,18 10,40 54,40' fill='%23166534'/%3E%3Cpolygon points='32,30 6,52 58,52' fill='%2314532d'/%3E%3Ccircle cx='24' cy='24' r='3' fill='%23dc2626'/%3E%3Ccircle cx='39' cy='25' r='3' fill='%23facc15'/%3E%3Ccircle cx='20' cy='37' r='3' fill='%23facc15'/%3E%3Ccircle cx='42' cy='36' r='3' fill='%23dc2626'/%3E%3Ccircle cx='28' cy='47' r='3' fill='%23dc2626'/%3E%3Ccircle cx='38' cy='48' r='3' fill='%23facc15'/%3E%3Cpolygon points='32,2 34,7 39,7 35,10 36,15 32,12 28,15 29,10 25,7 30,7' fill='%23facc15'/%3E%3C/svg%3E">
</head>
<body style="font-family: Arial, sans-serif; background: linear-gradient(135deg, #14532d 0%, #166534 45%, #991b1b 100%); margin: 0; padding: 40px 16px; min-height: 100vh; color: #1f2937; box-sizing: border-box;">

  <!-- Khung chứa Form chính -->
  <div style="max-width: 520px; 
  margin: 0 auto; 
  background-color: #fffdf9;
   padding: 32px;
    border-radius: 16px; 
    border: 3px solid #dc2626; 
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28);">
    
    <div style="text-align: center; margin-bottom: 8px; font-size: 28px;">
      🎅🎄❄️🎁🔔
    </div>

    <h2 style="margin-top: 0; 
    margin-bottom: 8px; text-align: center; 
    color: #b91c1c; font-size: 24px;">
       Đăng Ký Ứng Tuyển 
    </h2>
    <p style="margin-top: 0;
     margin-bottom: 24px; 
     text-align: center; 
     color: #15803d; 
     font-size: 14px; font-weight: bold;">
      ❄️ Vui lòng điền đầy đủ thông tin bên dưới để gửi hồ sơ của bạn ❄️
    </p>

    <form action="#" method="POST" enctype="multipart/form-data">
      
      <!-- 1. Họ và tên (Full Name) -->
      <div style="margin-bottom: 18px; 
      padding: 12px; background-color: #f0fdf4; 
      border: 1px solid #bbf7d0; border-radius: 10px;">
        <label for="fullName" style="display: block; 
        margin-bottom: 6px; 
        font-weight: bold; 
        font-size: 14px; color: #14532d;">
          🎅 Họ và tên (Full Name) <span style="color: #dc2626;">*</span>
        </label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          placeholder="Nhập họ và tên của bạn" 
          required
          style="width: 100%;
           padding: 10px 12px;
            border: 1px solid #86efac; 
            border-radius: 8px; 
            background-color: #ffffff; 
            font-size: 14px; box-sizing: border-box;"
        >
      </div>

      <!-- 2. Địa chỉ Email (Email Address) -->
      <div style="margin-bottom: 18px;
       padding: 12px; background-color: #fef2f2;
        border: 1px solid #fecaca;
         border-radius: 10px;">
        <label for="email" style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #991b1b;">
          ✉️ Địa chỉ Email (Email Address) <span style="color: #dc2626;">*</span>
        </label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          placeholder="example@email.com" 
          required
          style="width: 100%;
           padding: 10px 12px;
            border: 1px solid #fca5a5;
             border-radius: 8px;
              background-color: #ffffff; font-size: 14px;
              
              box-sizing: border-box;"
        >
      </div>

      <!-- 3. Số điện thoại (Phone) -->
      <div style="margin-bottom: 18px; padding: 12px; background-color: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;">
        <label for="phone" style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #14532d;">
          🔔 Số điện thoại (Phone) <span style="color: #dc2626;">*</span>
        </label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          placeholder="Nhập số điện thoại liên hệ" 
          required
          style="width: 100%; padding: 10px 12px; border: 1px solid #86efac; border-radius: 8px; background-color: #ffffff; font-size: 14px; box-sizing: border-box;"
        >
      </div>

      <!-- 4. Thư giới thiệu bản thân (Cover Letter) -->
      <div style="margin-bottom: 18px; padding: 12px; background-color: #fef2f2; border: 1px solid #fecaca; border-radius: 10px;">
        <label for="coverLetter" style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #991b1b;">
          ❄️ Thư giới thiệu bản thân (Cover Letter)
        </label>
        <textarea 
          id="coverLetter" 
          name="coverLetter" 
          rows="5" 
          placeholder="Giới thiệu ngắn gọn về bản thân, kỹ năng và lý do bạn ứng tuyển..."
          style="width: 100%; padding: 10px 12px; border: 1px solid #fca5a5; border-radius: 8px; background-color: #ffffff; font-size: 14px; font-family: Arial, sans-serif; resize: vertical; box-sizing: border-box;"
        ></textarea>
      </div>

      <!-- 5. Tải lên CV/Resume (Upload Resume/CV) -->
      <div style="margin-bottom: 24px; 
      padding: 12px; 
      background-color: #f0fdf4; 
      border: 1px solid #bbf7d0;
       border-radius: 10px;">
        <label for="resume" style="display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; color: #14532d;">
          🎁 Tải lên CV/Resume (Upload Resume/CV) <span style="color: #dc2626;">*</span>
        </label>
        <input 
          type="file" 
          id="resume" 
          name="resume" 
          accept=".pdf,.doc,.docx" 
          required
          style="width: 100%; padding: 10px; border: 2px dashed #16a34a; border-radius: 8px; background-color: #ffffff; font-size: 14px; box-sizing: border-box;"
        >
        <small style="display: block; margin-top: 6px; color: #166534; font-size: 12px;">
          🎄 Chấp nhận định dạng: PDF, DOC, DOCX
        </small>
      </div>

      <!-- 6. Nút gửi biểu mẫu -->
      <button 
        type="submit"
        style="width: 100%; padding: 13px; 
        background: linear-gradient(90deg, #dc2626 0%, #15803d 100%); 
        color: #ffffff; border: 2px solid #facc15;
         border-radius: 10px; font-size: 16px;
          font-weight: bold; cursor: pointer; 
          box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3);"
      >
        🎄 Gửi Hồ Sơ Ứng Tuyển 🎁
      </button>

    </form>
  </div>

</body>
</html>
